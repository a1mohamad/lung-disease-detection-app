services:
  app-runtime:
    image: lung-app-runtime:dev
    build:
      context: .
      dockerfile: Dockerfile.runtime
    env_file:
      - .env.runtime
    ports:
      - "${APP_PORT:-8000}:8000"
    # Runtime flags (DB/Kafka/MLflow/TF) come only from env_file above — not from deployment/.env.
    volumes:
      - ./saved_models:/app/saved_models:ro
      - ./assets:/app/assets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
