services:
  # SQL Server stores prediction logs for the local application stack.
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # Initializes both application and MLflow databases before dependent services
  # start using them. The loop allows SQL Server time to become ready.
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    volumes:
      - ./db/init:/db/init
    entrypoint: >
      /bin/bash -c "until /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${MSSQL_SA_PASSWORD} -i /db/init/create_databases.sql; do sleep 5; done"

  # FastAPI inference service. Model and artifact directories are mounted so the
  # container can use local saved models and expose generated prediction images.
  app:
    build: .
    depends_on:
      - db
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TF_CPP_MIN_LOG_LEVEL: "${TF_CPP_MIN_LOG_LEVEL:-3}"
      TF_ENABLE_ONEDNN_OPTS: "${TF_ENABLE_ONEDNN_OPTS:-0}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_NAME: "${DB_NAME:-lung_detection}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DRIVER: "${DB_DRIVER:-ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"
      DB_LOGGING_ENABLED: "true"
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      MLFLOW_MODEL_STAGE: "${MLFLOW_MODEL_STAGE:-Production}"
    volumes:
      - ./saved_models:/app/saved_models
      - ./assets:/app/assets
      - ./runtime:/app/runtime
      - ./mlops/mlflow/artifacts:/mlflow/artifacts

  # Persistence consumer. It owns database writes when Kafka is enabled so the
  # API route can return predictions without blocking on relational logging.
  consumer_db:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_NAME: "${DB_NAME:-lung_detection}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DRIVER: "${DB_DRIVER:-ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"
      DB_LOGGING_ENABLED: "true"
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      KAFKA_GROUP_DB: "${KAFKA_GROUP_DB:-lung-consumer-db}"
    command: ["python", "-m", "kafka_pipeline.consumers.consumer_db"]
    volumes:
      - ./runtime:/app/runtime

  # Monitoring consumer writes rolling-window metrics to runtime JSONL.
  consumer_monitoring:
    build: .
    environment:
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      KAFKA_GROUP_MONITORING: "${KAFKA_GROUP_MONITORING:-lung-consumer-monitoring}"
    command: ["python", "-m", "kafka_pipeline.consumers.consumer_monitoring"]
    volumes:
      - ./runtime:/app/runtime

  # Analytics consumer stores compact model-behavior records for dashboards.
  consumer_analytics:
    build: .
    environment:
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      KAFKA_GROUP_ANALYTICS: "${KAFKA_GROUP_ANALYTICS:-lung-consumer-analytics}"
    command: ["python", "-m", "kafka_pipeline.consumers.consumer_analytics"]
    volumes:
      - ./runtime:/app/runtime

  # Doctor-review consumer writes artifact links for human inspection queues.
  consumer_doctor:
    build: .
    environment:
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      KAFKA_GROUP_DOCTOR: "${KAFKA_GROUP_DOCTOR:-lung-consumer-doctor}"
    command: ["python", "-m", "kafka_pipeline.consumers.consumer_doctor_images"]
    volumes:
      - ./runtime:/app/runtime

  # Notification consumer writes user-facing message drafts to a JSONL outbox.
  consumer_notifications:
    build: .
    environment:
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC_PREDICTIONS: "${KAFKA_TOPIC_PREDICTIONS:-lung.predictions}"
      KAFKA_GROUP_NOTIFICATIONS: "${KAFKA_GROUP_NOTIFICATIONS:-lung-consumer-notifications}"
    command: ["python", "-m", "kafka_pipeline.consumers.consumer_notifications"]
    volumes:
      - ./runtime:/app/runtime

volumes:
  # Named volume keeps SQL Server data across container restarts.
  mssql_data:
