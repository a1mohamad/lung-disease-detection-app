services:
  # Airflow metadata database. This is separate from the application/MLflow SQL
  # Server database so Airflow can manage its own schema cleanly.
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${AIRFLOW_DB_USER:-airflow}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:-airflow}"
      POSTGRES_DB: "${AIRFLOW_DB_NAME:-airflow}"
    ports:
      - "${AIRFLOW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  # SQL Server backs MLflow metadata and can also support local prediction logs.
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # Creates required SQL Server databases before MLflow starts.
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    volumes:
      - ./db/init:/db/init
    entrypoint: >
      /bin/bash -c "until /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${MSSQL_SA_PASSWORD} -i /db/init/create_databases.sql; do sleep 5; done"

  # MLflow tracking server used by evaluation, retraining, registry, and release
  # workflows. Artifacts are mounted to a local directory for easy inspection.
  mlflow:
    image: lung-mlflow:dev
    build: ./mlops/mlflow
    depends_on:
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: "${MLFLOW_BACKEND_STORE_URI}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/artifacts}"
      MLFLOW_ALLOWED_HOSTS: "${MLFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1,mlflow,localhost:5000,127.0.0.1:5000,mlflow:5000}"
    volumes:
      - ./mlops/mlflow/artifacts:/mlflow/artifacts

  # Airflow orchestrator for scheduled evaluation/retraining DAGs. The project
  # root and research directory are mounted so DAG tasks can access code/data.
  airflow:
    image: lung-airflow:dev
    build:
      context: ./mlops
      dockerfile: airflow/Dockerfile
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:ADMIN}"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "${AIRFLOW_SIMPLE_AUTH_MANAGER_PASSWORDS_FILE:-/opt/project/runtime/airflow/simple_auth_manager_passwords.json}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      PROJECT_ROOT: "/opt/project"
      PYTHONPATH: "/opt/project"
      TF_CPP_MIN_LOG_LEVEL: "${TF_CPP_MIN_LOG_LEVEL:-3}"
      TF_ENABLE_ONEDNN_OPTS: "${TF_ENABLE_ONEDNN_OPTS:-0}"
      RETRAIN_DATASET_MODE: "${RETRAIN_DATASET_MODE:-legacy}"
      RETRAIN_DRY_RUN: "${RETRAIN_DRY_RUN:-true}"
      REVIEWED_DATA_BACKEND: "${REVIEWED_DATA_BACKEND:-local}"
      REVIEWED_DATA_LOCAL_ROOT: "${REVIEWED_DATA_LOCAL_ROOT:-/opt/project/reviewed_data/incoming}"
      REVIEWED_DATA_MANIFEST_INDEX: "${REVIEWED_DATA_MANIFEST_INDEX:-index.json}"
      REVIEWED_DATA_INCLUDE_BASELINE: "${REVIEWED_DATA_INCLUDE_BASELINE:-true}"
      REVIEWED_DATA_SUPABASE_URL: "${REVIEWED_DATA_SUPABASE_URL:-}"
      REVIEWED_DATA_SUPABASE_SERVICE_ROLE_KEY: "${REVIEWED_DATA_SUPABASE_SERVICE_ROLE_KEY:-}"
      REVIEWED_DATA_SUPABASE_BUCKET: "${REVIEWED_DATA_SUPABASE_BUCKET:-reviewed-training-data}"
      REVIEWED_DATA_SUPABASE_PREFIX: "${REVIEWED_DATA_SUPABASE_PREFIX:-reviewed-data}"
      RETRAIN_TFRECORD_SHARDS: "${RETRAIN_TFRECORD_SHARDS:-10}"
      RETRAIN_SPLIT_SEED: "${RETRAIN_SPLIT_SEED:-lung-detection-v1}"
      HF_PUBLISH_ENABLED: "${HF_PUBLISH_ENABLED:-false}"
      HF_PUBLISH_REPO_ID: "${HF_PUBLISH_REPO_ID:-a1mohamadd/lung-disease-detection}"
      HF_PUBLISH_REPO_TYPE: "${HF_PUBLISH_REPO_TYPE:-model}"
      HF_PUBLISH_REVISION: "${HF_PUBLISH_REVISION:-main}"
      HF_PUBLISH_CREATE_PR: "${HF_PUBLISH_CREATE_PR:-false}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ./mlops/airflow/dags:/opt/airflow/dags
      - ./:/opt/project
      - ../research:/opt/project/research:ro
      - ./mlops/mlflow/artifacts:/mlflow/artifacts
    depends_on:
      airflow-db:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["airflow", "standalone"]

  # Manual profile used to backfill historical notebook/model information into
  # MLflow without running it as part of the always-on stack.
  post_hoc_backfill:
    image: lung-airflow:dev
    profiles: ["manual"]
    environment:
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      PYTHONPATH: "/opt/project"
      PROJECT_ROOT: "/opt/project"
      TF_CPP_MIN_LOG_LEVEL: "${TF_CPP_MIN_LOG_LEVEL:-3}"
      TF_ENABLE_ONEDNN_OPTS: "${TF_ENABLE_ONEDNN_OPTS:-0}"
    volumes:
      - ./:/opt/project
      - ../research:/opt/project/research:ro
      - ./mlops/mlflow/artifacts:/mlflow/artifacts
    depends_on:
      - mlflow
    command: >
      bash -c "python /opt/project/mlops/jobs/post_hoc_backfill.py --register-model"

volumes:
  # Persist SQL Server and Airflow metadata between local container restarts.
  mssql_data:
  airflow_pg_data:



