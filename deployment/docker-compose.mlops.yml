services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${AIRFLOW_DB_USER:-airflow}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:-airflow}"
      POSTGRES_DB: "${AIRFLOW_DB_NAME:-airflow}"
    ports:
      - "${AIRFLOW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    volumes:
      - ./db/init:/db/init
    entrypoint: >
      /bin/bash -c "until /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${MSSQL_SA_PASSWORD} -i /db/init/create_databases.sql; do sleep 5; done"

  mlflow:
    image: lung-mlflow:dev
    build: ./mlops/mlflow
    depends_on:
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: "${MLFLOW_BACKEND_STORE_URI}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/artifacts}"
      MLFLOW_ALLOWED_HOSTS: "${MLFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1,mlflow,localhost:5000,127.0.0.1:5000,mlflow:5000}"
    volumes:
      - ./mlops/mlflow/artifacts:/mlflow/artifacts

  airflow:
    image: lung-airflow:dev
    build:
      context: ./mlops
      dockerfile: airflow/Dockerfile
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:ADMIN}"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "${AIRFLOW_SIMPLE_AUTH_MANAGER_PASSWORDS_FILE:-/opt/project/runtime/airflow/simple_auth_manager_passwords.json}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      PROJECT_ROOT: "/opt/project"
      PYTHONPATH: "/opt/project"
      TF_CPP_MIN_LOG_LEVEL: "${TF_CPP_MIN_LOG_LEVEL:-3}"
      TF_ENABLE_ONEDNN_OPTS: "${TF_ENABLE_ONEDNN_OPTS:-0}"
    volumes:
      - ./mlops/airflow/dags:/opt/airflow/dags
      - ./:/opt/project
      - ../research:/opt/project/research:ro
      - ./mlops/mlflow/artifacts:/mlflow/artifacts
    depends_on:
      airflow-db:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["airflow", "standalone"]

  post_hoc_backfill:
    image: lung-airflow:dev
    profiles: ["manual"]
    environment:
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      PYTHONPATH: "/opt/project"
      PROJECT_ROOT: "/opt/project"
      TF_CPP_MIN_LOG_LEVEL: "${TF_CPP_MIN_LOG_LEVEL:-3}"
      TF_ENABLE_ONEDNN_OPTS: "${TF_ENABLE_ONEDNN_OPTS:-0}"
    volumes:
      - ./:/opt/project
      - ../research:/opt/project/research:ro
      - ./mlops/mlflow/artifacts:/mlflow/artifacts
    depends_on:
      - mlflow
    command: >
      bash -c "python /opt/project/mlops/jobs/post_hoc_backfill.py --register-model"

volumes:
  mssql_data:
  airflow_pg_data:



