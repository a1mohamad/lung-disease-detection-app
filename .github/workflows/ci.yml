name: CI and Manual Deployment

on:
  # Pull requests must pass the lightweight Python suite before merge.
  pull_request:
    branches: [main]
  # Pushes to main run CI and verify that the runtime image still builds.
  # The live portfolio Space is intentionally not restarted on every commit.
  push:
    branches: [main]
  # Deployments are manual because every Space commit rebuilds and restarts the
  # live Docker container.
  workflow_dispatch:

permissions:
  # The workflow only needs to read repository contents; deployments use the
  # Hugging Face token stored as a secret instead of broad GitHub permissions.
  contents: read

concurrency:
  # Push/PR runs may supersede older runs. Manual deployments use a separate
  # group and queue instead of being cancelled halfway through a Space rebuild.
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    env:
      # Optional integrations are disabled in CI so tests stay deterministic and
      # do not require database, Kafka, MLflow, or Hub credentials.
      # Make deployment packages importable during pytest collection.
      PYTHONPATH: "."
      DB_LOGGING_ENABLED: "false"
      KAFKA_ENABLED: "false"
      MLFLOW_ENABLED: "false"
      HF_MODEL_DOWNLOAD_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache both runtime and test requirement files so dependency changes
          # correctly invalidate the pip cache.
          cache: pip
          cache-dependency-path: |
            deployment/requirements-runtime.txt
            deployment/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run lightweight test suite
        # Coverage is reported in the terminal to keep CI simple without
        # requiring an external coverage upload service.
        run: pytest --cov=app --cov=kafka_pipeline --cov-report=term-missing

  docker-build:
    name: Runtime Docker build
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Hugging Face runtime image
        run: docker build --file deployment/Dockerfile.runtime --tag lung-detection-runtime:${{ github.sha }} deployment

  deploy-space:
    name: Deploy Hugging Face Space (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # The target Space and health URL are kept explicit so deployment logs
      # show exactly which runtime is being updated and verified.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: a1mohamadd/lung-disease-detection-api
      SPACE_HEALTH_URL: https://a1mohamadd-lung-disease-detection-api.hf.space/health

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: pip install huggingface-hub==1.24.0

      - name: Verify deployment token
        # Fail before preparing/uploading a bundle when production secrets are
        # missing from the repository or environment.
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "GitHub secret HF_TOKEN is required for deployment."
            exit 1
          fi

      - name: Prepare Space bundle
        # The Space receives only deployable runtime files, not notebooks,
        # training artifacts, compose files, or local development assets.
        run: |
          mkdir -p space-bundle/assets
          cp deployment/Dockerfile.runtime space-bundle/Dockerfile
          cp deployment/requirements-runtime.txt space-bundle/requirements-runtime.txt
          cp -R deployment/app space-bundle/app
          cp -R deployment/kafka_pipeline space-bundle/kafka_pipeline
          cp -R deployment/frontend space-bundle/frontend
          cp deployment/assets/*.json space-bundle/assets/

      - name: Verify existing Space
        # Do not call create_repo here. New Docker Spaces require a paid plan,
        # while this deployment targets the already-existing portfolio Space.
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_SPACE_ID"]
          info = HfApi(token=os.environ["HF_TOKEN"]).repo_info(
              repo_id=repo_id,
              repo_type="space",
          )
          if info.id != repo_id:
              raise RuntimeError(
                  f"Resolved unexpected Space: expected {repo_id}, received {info.id}"
              )
          print(f"Verified existing Space: {info.id}")
          PY

      - name: Commit runtime to existing Hugging Face Space
        id: upload
        # HfApi.upload_folder assumes the repository already exists and commits
        # directly to it. Unlike `hf upload`, it does not first call create_repo,
        # which Hugging Face now rejects for free Docker Space creation.
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          result = HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              revision="main",
              folder_path="space-bundle",
              path_in_repo=".",
              commit_message=f"Deploy GitHub commit {os.environ['GITHUB_SHA']}",
          )
          print(result)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit_sha={result.oid}\n")
          PY

      - name: Wait for deployed API
        # A plain health request can hit the previous container while the new
        # build is queued. Wait until the runtime reports the exact uploaded
        # commit, then verify the API itself.
        env:
          HF_DEPLOY_COMMIT: ${{ steps.upload.outputs.commit_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          repo_id = os.environ["HF_SPACE_ID"]
          expected_sha = os.environ["HF_DEPLOY_COMMIT"]
          health_url = os.environ["SPACE_HEALTH_URL"]
          info_url = f"https://huggingface.co/api/spaces/{repo_id}"
          failed_stages = {"BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"}

          for attempt in range(1, 46):
              try:
                  with urlopen(info_url, timeout=15) as response:
                      info = json.load(response)
                  runtime = info.get("runtime") or {}
                  stage = runtime.get("stage", "UNKNOWN")
                  runtime_sha = runtime.get("sha", "")
                  print(
                      f"Space attempt {attempt}/45: "
                      f"stage={stage} runtime_sha={runtime_sha or 'none'}"
                  )

                  if runtime_sha == expected_sha and stage in failed_stages:
                      raise RuntimeError(
                          f"Space failed to deploy commit {expected_sha}: stage={stage}"
                      )

                  if runtime_sha == expected_sha and stage == "RUNNING":
                      with urlopen(health_url, timeout=15) as response:
                          if response.status == 200:
                              print(
                                  "Space is running the uploaded commit and "
                                  "the health check passed."
                              )
                              break
              except URLError as exc:
                  print(f"Space status request failed temporarily: {exc}")

              time.sleep(20)
          else:
              raise TimeoutError(
                  f"Space did not run commit {expected_sha} before the timeout."
              )
          PY
