name: CI/CD

on:
  # Pull requests must pass the lightweight Python suite before merge.
  pull_request:
    branches: [main]
  # Pushes to main additionally build and deploy the runtime image.
  push:
    branches: [main]
  # Manual dispatch lets maintainers verify the pipeline after secret or
  # infrastructure changes without creating a dummy commit.
  workflow_dispatch:

permissions:
  # The workflow only needs to read repository contents; deployments use the
  # Hugging Face token stored as a secret instead of broad GitHub permissions.
  contents: read

concurrency:
  # New commits supersede older CI runs for the same branch, saving minutes on
  # repeated pushes while keeping main protected by the latest result.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    env:
      # Optional integrations are disabled in CI so tests stay deterministic and
      # do not require database, Kafka, MLflow, or Hub credentials.
      # Make deployment packages importable during pytest collection.
      PYTHONPATH: "."
      DB_LOGGING_ENABLED: "false"
      KAFKA_ENABLED: "false"
      MLFLOW_ENABLED: "false"
      HF_MODEL_DOWNLOAD_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache both runtime and test requirement files so dependency changes
          # correctly invalidate the pip cache.
          cache: pip
          cache-dependency-path: |
            deployment/requirements-runtime.txt
            deployment/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run lightweight test suite
        # Coverage is reported in the terminal to keep CI simple without
        # requiring an external coverage upload service.
        run: pytest --cov=app --cov=kafka_pipeline --cov-report=term-missing

  docker-build:
    name: Runtime Docker build
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Hugging Face runtime image
        run: docker build --file deployment/Dockerfile.runtime --tag lung-detection-runtime:${{ github.sha }} deployment

  deploy-space:
    name: Deploy Hugging Face Space
    if: github.event_name == 'push'
    needs: [tests, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # The target Space and health URL are kept explicit so deployment logs
      # show exactly which runtime is being updated and verified.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: a1mohamadd/lung-disease-detection-api
      SPACE_HEALTH_URL: https://a1mohamadd-lung-disease-detection-api.hf.space/health

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: pip install huggingface-hub==1.2.1

      - name: Verify deployment token
        # Fail before preparing/uploading a bundle when production secrets are
        # missing from the repository or environment.
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "GitHub secret HF_TOKEN is required for deployment."
            exit 1
          fi

      - name: Prepare Space bundle
        # The Space receives only deployable runtime files, not notebooks,
        # training artifacts, compose files, or local development assets.
        run: |
          mkdir -p space-bundle/assets
          cp deployment/Dockerfile.runtime space-bundle/Dockerfile
          cp deployment/requirements-runtime.txt space-bundle/requirements-runtime.txt
          cp -R deployment/app space-bundle/app
          cp -R deployment/kafka_pipeline space-bundle/kafka_pipeline
          cp -R deployment/frontend space-bundle/frontend
          cp deployment/assets/*.json space-bundle/assets/

      - name: Upload runtime to Hugging Face Space
        run: |
          hf upload "$HF_SPACE_ID" space-bundle . \
            --repo-type space \
            --commit-message "Deploy GitHub commit $GITHUB_SHA"

      - name: Wait for deployed API
        # Hugging Face Spaces rebuild asynchronously after upload; poll the
        # public health endpoint until the new container is serving traffic.
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "$SPACE_HEALTH_URL"; then
              echo
              echo "Space health check passed."
              exit 0
            fi
            echo "Waiting for Space rebuild ($attempt/45)..."
            sleep 20
          done
          echo "Space did not become healthy before the timeout."
          exit 1
